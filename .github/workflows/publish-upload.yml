name: Publish Hotbar Customizer upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select uploaded package
        id: pkg
        shell: bash
        run: |
          ZIP=$(find upload -maxdepth 1 -type f -name 'HotbarCustomizer_v*.zip' | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No upload ZIP found."
            exit 1
          fi
          FILE=$(basename "$ZIP")
          VERSION=${FILE#HotbarCustomizer_v}
          VERSION=${VERSION%.zip}
          TAG="V${VERSION}"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify package and version
        shell: bash
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          test -s "$ZIP"
          unzip -l "$ZIP" | grep -q 'HotbarVisualProbe.dll'
          unzip -l "$ZIP" | grep -q 'HotbarVisualProbe.json'
          unzip -l "$ZIP" | grep -q 'images/icon.png'
          unzip -p "$ZIP" HotbarVisualProbe.json > /tmp/HotbarVisualProbe.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/HotbarVisualProbe.json', encoding='utf-8-sig') as f:
              manifest = json.load(f)
          expected = os.environ['VERSION'] + '.0'
          actual = manifest.get('AssemblyVersion')
          if actual != expected:
              raise SystemExit(f'AssemblyVersion mismatch: ZIP={actual!r}, filename={expected!r}')
          print(f'Verified AssemblyVersion: {actual}')
          PY

      - name: Sync icon from package
        shell: bash
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -euo pipefail
          mkdir -p images
          unzip -p "$ZIP" images/icon.png > images/icon.png
          test -s images/icon.png

      - name: Sync pluginmaster and version
        shell: bash
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          version = os.environ['VERSION']
          assembly = f'{version}.0'
          url = f'https://github.com/elpapityo/Hotbar-Customizer/releases/download/V{version}/HotbarCustomizer_v{version}.zip'
          icon = f'https://raw.githubusercontent.com/elpapityo/Hotbar-Customizer/main/images/icon.png?v={version}'

          path = Path('pluginmaster.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          if not isinstance(data, list) or not data:
              raise SystemExit('pluginmaster.json must contain a non-empty JSON array')
          entry = data[0]
          entry['AssemblyVersion'] = assembly
          entry['TestingAssemblyVersion'] = assembly
          entry['DownloadLinkInstall'] = url
          entry['DownloadLinkUpdate'] = url
          entry['DownloadLinkTesting'] = url
          entry['IconUrl'] = icon
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('VERSION.txt').write_text(version + '\n', encoding='utf-8')
          print(f'Synced metadata -> {assembly}')
          PY

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pluginmaster.json VERSION.txt images/icon.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pluginmaster.json VERSION.txt images/icon.png
            git commit -m "Sync Hotbar Customizer release files"
            git push
          else
            echo "Release metadata already synchronized."
          fi

      - name: Create or replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Hotbar Customizer v${VERSION}" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --title "Hotbar Customizer v${VERSION}" --notes-file CHANGELOG.md
          fi
